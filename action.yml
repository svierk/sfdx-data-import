name: SFDX Data Import
description: Salesforce import action for uploading records based on CSV (Bulk API 2.0) or JSON (sObject Tree) format.

branding:
  icon: upload-cloud
  color: blue

inputs:
  file-path:
    description: >
      Path to CSV or JSON files that contain the data to be uploaded.
      CSV (Bulk API 2.0) only supports a single file.
      JSON (sObject Tree) supports one or multiple files that contain the records, in-order and as a comma-separated or multi-line list.
    required: true
  object-type:
    description: >
      API name of the Salesforce object, either standard or custom, that you want to update or delete records from.
      Only required for CSV file based upload using Bulk API 2.0.
    required: false
  external-id:
    description: >
      Name of the external ID field, or the Id field.
      Only required for CSV file based upload using Bulk API 2.0.
    required: false
    default: Id
  target-org:
    description: Username or alias of the target org. Not required if default org is already set.
    required: false
  api-version:
    description: Override the api version used for api requests made by this action, for example '59.0'.
    required: false
  step-summary:
    description: Write a result section to the GitHub Actions job summary. Set to false to avoid collisions with a custom workflow summary.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Data Import
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
        OBJECT_TYPE: ${{ inputs.object-type }}
        EXTERNAL_ID: ${{ inputs.external-id }}
        TARGET_ORG: ${{ inputs.target-org }}
        API_VERSION: ${{ inputs.api-version }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail

        # Splits a comma- or newline-separated input into the global SPLIT array
        # and trims the surrounding whitespace, so that both notations work:
        #   file-path: './data/accounts.json,./data/contacts.json'
        #   file-path: |
        #     ./data/accounts.json
        #     ./data/contacts.json
        split_list() {
          SPLIT=()
          local raw item
          raw="${1//,/$'\n'}"
          while IFS= read -r item; do
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            if [[ -n "$item" ]]; then
              SPLIT+=("$item")
            fi
          done <<< "$raw"
        }

        split_list "$FILE_PATH"
        files=(${SPLIT[@]+"${SPLIT[@]}"})

        if [[ ${#files[@]} -eq 0 ]]; then
          echo "::error::The 'file-path' input does not contain any file."
          exit 1
        fi

        # The file extension selects the import API, so all files must share it
        # (CSV is single-file, JSON may be an in-order list of files).
        extension=""
        for f in "${files[@]}"; do
          name="$(basename "$f")"
          ext="${name##*.}"
          ext="${ext,,}"
          if [[ -z "$extension" ]]; then
            extension="$ext"
          elif [[ "$ext" != "$extension" ]]; then
            echo "::error::All files must share the same extension, found '.$extension' and '.$ext'."
            exit 1
          fi
        done

        file_list="$(printf '%s, ' "${files[@]}")"
        file_list="${file_list%, }"

        args=()

        if [[ -n "$TARGET_ORG" ]]; then
          args+=(--target-org "$TARGET_ORG")
        fi

        if [[ -n "$API_VERSION" ]]; then
          args+=(--api-version "$API_VERSION")
        fi

        case "$extension" in
          csv)
            if [[ -z "$OBJECT_TYPE" ]]; then
              echo "::error::CSV upload (Bulk API 2.0) requires the 'object-type' input."
              exit 1
            fi
            if [[ ${#files[@]} -gt 1 ]]; then
              echo "::error::CSV upload (Bulk API 2.0) supports a single file only, got ${#files[@]}: $file_list"
              exit 1
            fi
            args+=(--sobject "$OBJECT_TYPE")
            args+=(--external-id "$EXTERNAL_ID")
            sf data upsert bulk --file "${files[0]}" "${args[@]}"
            format="CSV (Bulk API 2.0)"
            ;;
          json)
            # One --files flag per file keeps the given order.
            for f in "${files[@]}"; do
              args+=(--files "$f")
            done
            sf data import tree "${args[@]}"
            format="JSON (sObject Tree)"
            ;;
          *)
            echo "::error::Unsupported file extension '.$extension'. Only .csv (Bulk API 2.0) and .json (sObject Tree) are supported."
            exit 1
            ;;
        esac

        echo "✅ Successfully imported data from: $file_list"

        if [[ "$STEP_SUMMARY" == "true" ]]; then
          {
            echo ""
            echo "### 💾 Data imported"
            echo ""
            echo "- **File(s):** $(printf '`%s`, ' "${files[@]}" | sed 's/, $//')"
            echo "- **Format:** $format"
            if [[ "$extension" == "csv" ]]; then
              echo "- **Object:** \`$OBJECT_TYPE\`"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi
